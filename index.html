<style>

.w{max-width:760px;margin:auto;padding:16px}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,var(--ink3),var(--ink2));border:1px solid #3b5b7a;border-radius:20px;padding:16px}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),#ffffff1c 0);display:grid;place-items:center;flex:none}

.hero h1{font-size:1.45rem;line-height:1.15}.hero p{margin:4px 0 0;color:var(--mute);font-size:.9rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{background:#ffffff14;border-radius:99px;padding:3px 11px;font-size:.82rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1722ee;backdrop-filter:blur(8px);border-top:1px solid #2f4a63;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:11px 4px;font:600 .85rem system-ui;cursor:pointer}nav button.on{color:var(--gold);box-shadow:inset 0 3px var(--gold)}
.card{background:var(--ink2);border:1px solid #2f4a63;border-radius:16px;padding:16px;margin-top:14px}

.k{color:var(--gold);font-size:.85rem;font-weight:700}

ul{padding-left:20px;margin:6px 0}li{margin:5px 0}
.say{border-left:4px solid var(--hib);background:#c0284f22;padding:10px 12px;border-radius:0 10px 10px 0;font-style:italic}
.warn{border-left:4px solid var(--gold);background:#e0a93b1c;padding:10px 12px;border-radius:0 10px 10px 0;font-size:.93rem}
.brain{background:linear-gradient(120deg,#16405a,#2b2757);border-color:#5b6fb0}
button.b{background:var(--gold);color:#1a1405;border:0;border-radius:12px;padding:11px 16px;font:700 .95rem system-ui;cursor:pointer;margin:6px 6px 0 0}
button.g{background:#ffffff1a;color:var(--pearl)}button.b:focus-visible,nav button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px}

.d i{font-style:normal;font-size:26px;display:block}.d small{color:var(--mute);display:block;line-height:1.2;margin-top:2px}
.d.ok{border-color:var(--mint);background:#7ccfa81c}.d.lock{opacity:.4}.d.cur{border-color:var(--gold);box-shadow:0 0 0 2px #e0a93b55}

.hid{display:none}@media(prefers-reduced-motion:no-preference){.card{animation:u .35s ease}@keyframes u{from{opacity:0;transform:translateY(6px)}}}

const D=[
{i:"🍽️",t:"Restaurant basics",k:"Basics",c:["#18304a","#c0284f"],p:["Yasmine Palace is a Levantine restaurant in The Pearl, Qatar. It has authentic flavors and Andalusian heritage.","Your goal: the correct dish, to the correct guest, safely and politely.","If you do not know something, ask. Never guess.","Keep your table setup full. Approach a guest within 5 minutes with a warm smile."],s:"“Ahlan Wa Sahlan, welcome to Yasmine Palace.”",q:"What is the welcome drink (Yasmina) made of?",a:"Hibiscus with lemon, rose water and sugar.",e:"Guest sits down. Within 5 minutes you smile, welcome them and serve Yasmina (only after asking about allergies)."},

{i:"⏱️",t:"Timing and serving rules",k:"Basics",c:["#0f1f2e","#e0a93b"],p:["Starters: within 7 minutes. Salads: within 10 minutes. Mains: 20 to 30 minutes. Drinks: 5 to 10 minutes.","Refill a glass in less than 30 seconds. Offer a refill when the glass is 1/3 full.","Announce each dish. Serve the correct guest. Women first when appropriate.","Serve from the side that does not block the guest’s space."],s:"“Good evening, here is your [dish name]. Please let me know if you need anything else.”",q:"How many minutes for a main course after the order?",a:"20 to 30 minutes.",e:"Order at 7:00 pm. Starters by 7:07. Salads by 7:10. Mains between 7:20 and 7:30."},
{i:"🛡️",t:"Allergy rules",k:"Allergy",c:["#7a1631","#e0a93b"],p:["Ask about allergies BEFORE serving Yasmina.","Allergy declared: do NOT serve Yasmina. Tell the Supervisor/Manager and the Culinary team at once.","Never guess if a dish is allergen-free.","Never say “100% safe” or “no cross-contamination”."],s:"“I’m sorry, I don’t want to give you incorrect information. I’ll check with our kitchen and manager before confirming.”",q:"A guest has a nut allergy. Do you serve Yasmina?",a:"No. Do not serve it. Tell the Supervisor/Manager and the kitchen.",w:"Allergy safety is more important than speed. If unsure, stop and ask."},
{i:"🔁",t:"Review 1 (Days 1–4)",k:"Review",c:["#244463","#c0284f"],p:["Yasmina: hibiscus, lemon, rose water, sugar.","Starters 7 min · Salads 10 min · Mains 20–30 min.","Allergy = no Yasmina + tell manager and kitchen.","Step 8 is for the manager/supervisor only."],s:"“I want to make sure I give you the correct information. Let me confirm with our kitchen.”",q:"Say the 3 timing standards for food.",a:"Starters 7, salads 10, mains 20 to 30 minutes."},
{i:"🗣️",t:"Handling a guest with allergies",k:"Allergy",c:["#7a1631","#7ccfa8"],p:["Ask the guest to explain the allergy clearly.","Tell the captain/manager and the kitchen. Include the bar team if drinks are involved.","Confirm sauces, garnish, oils, substitutions and cross-contact.","If the kitchen cannot confirm, tell the captain. Do not promise anything to the guest."],s:"“Thank you for telling me. I will inform our manager and kitchen right now.”",q:"The kitchen cannot confirm a dish is safe. What do you do?",a:"Tell the captain. Do not assure the guest.",e:"Guest: “Is the hummus safe for me?” You: “Let me check with the kitchen and manager first.”"},
{i:"📖",t:"Reading the menu PDF",k:"Allergy",c:["#18304a","#e0a93b"],p:["Each dish page lists ingredients and an “Allergen:” line.","In the text the allergen icons are not readable. So write: “Not specified – confirm”.","An ingredient list is not a full allergen list.","Menu note: for garlic cream, double-check with the chef if it has dairy."],s:"“I will check the full allergen information with our chef.”",q:"Is an ingredient list enough to say a dish is safe?",a:"No. Always confirm with the kitchen and manager."},

dish("🧆","Hot mezze 1",[["Yasmine Palace Falafel","soaked chickpeas, parsley, garlic, cumin, coriander, turmeric; served with tarator sauce"],["Batata Harra","potato, garlic, coriander, chili paste, olive oil, lemon"],["Spinach with Olive Oil","spinach, olive oil, garlic, onion"]],["#2f7d5b","#e0a93b"]),

dish("🍤","Hot mezze 3",[["Dynamite Shrimp with Rice","baby shrimp, egg, soya sauce, flour, starch, dynamite sauce, white rice, black sesame, spring onion"],["Hummus with Meat Shawarma","hummus, shawarma meat, parsley, paprika, pine nut"],["Meat Sausage with Pomegranate Sauce","sausage, lemon juice, olive oil, pomegranate sauce, garlic, pine nut"]],["#c0284f","#e0a93b"]),
dish("🍲","Soups",[["Lentil Soup","red lentil, carrot, potato, celery, leek, red onion, cumin, fried bread"],["Cream Mushroom Soup","mushroom, potato, celery, carrot, fresh cream, butter, fried bread"],["Cream Seafood Soup","shrimp, seafood mix, carrot, cabbage, garlic, tomato paste, flour, fresh cream, butter, oysters"]],["#b4621f","#e0a93b"]),
{i:"🔁",t:"Review 3 (Days 11–14)",k:"Review",c:["#244463","#c0284f"],p:["Falafel is served with tarator sauce.","Dynamite shrimp: baby shrimp with dynamite sauce and rice.","Cream Seafood Soup: shrimp, seafood mix, oysters, fresh cream.","Lentil soup comes with fried bread."],s:"“This is our Lentil Soup. For allergies, I will confirm with the kitchen.”",q:"Name 3 ingredients in Cream Seafood Soup.",a:"Shrimp, seafood mix, oysters, fresh cream (also carrot, cabbage, garlic, butter)."},
dish("🥗","Salads",[["Fattoush","tomato, lettuce, cucumber, mint, purslane, pomegranate sauce, sumac, olive oil, lemon juice, toasted bread"],["Classic Tabouleh","parsley, tomato, onion, mint, bulgur wheat, lemon juice, olive oil, seven spices"],["Goat Cheese Salad","goat cheese, mixed leaves, green apple, raisins, red figs, walnut, sesame, balsamic sauce"]],["#2f7d5b","#c0284f"]),
dish("🔥","Grills 1",[["Grilled Lamb Chops","lamb chops, black pepper, seven spices, chili paste; with dill rice and grilled sides"],["Shish Taouk","chicken breast marinated with yogurt and spices; with garlic cream and dill rice"],["Chicken Kebab","chicken breast, lamb fat, red capsicum, garlic, coriander"]],["#7a1631","#e0a93b"]),
dish("🍢","Grills 2",[["Marinated Shuqaf","marinated lamb shuqaf with lamb fat, salt, black pepper"],["Kebab Ezmerli with Hallomi Cheese","lamb skewers, lamb fat, seven spices, halloumi cheese"],["Charcoal Grilled Whole Chicken","whole chicken, yogurt, garlic, paprika, spices; with garlic cream"]],["#b4621f","#7a1631"]),
dish("🐟","Seafood and light mains",[["Grilled Tiger Shrimp with Saffron Rice","tiger shrimp, saffron rice, vegetables, butter and lemon cream sauce"],["Grilled Seabass with Vegetables","seabass, cumin, rice, saffron, pistachio, tarator sauce"],["Grilled Chicken Breast with Steamed Vegetables","chicken breast, broccoli, carrot, zucchini, green beans, lemon; Provencal sauce"]],["#1c6a8a","#7ccfa8"]),
{i:"🔁",t:"Review 4 (Days 16–19)",k:"Review",c:["#244463","#c0284f"],p:["Shish taouk comes with garlic cream. Double-check dairy with the chef.","Kebab Ezmerli has halloumi cheese.","Seabass: seabass, saffron rice, pistachio, tarator sauce.","Tabouleh uses bulgur wheat."],s:"“I’ll check the garlic cream with our chef.”",q:"Which grilled dish has halloumi cheese?",a:"Kebab Ezmerli with Hallomi Cheese."},
dish("🍛","Rice and mains 1",[["Ghouzi Lahem with Rice","slow-cooked lamb, spiced rice with nuts; cucumber yogurt on the side"],["Chicken Biryani","Punjab basmati rice, chicken, ghee, green peas, rose water, spices, raita"],["Lamb Biryani","Punjab basmati rice, lamb, ghee, green peas, rose water, spices, raita"]],["#b4621f","#e0a93b"]),
dish("🍚","Rice and mains 2",[["Qatari Meat Majbous","majbous rice, lamb, cardamom, star anise, cinnamon, turmeric, clove, lentil stuffing, pistachio, almond"],["Chicken Cashew Nuts with Rice","chicken breast, cashew, fresh cream, soya sauce, onion, ketchup, dill rice"],["Meat Mansaf with Jameed Yogurt","lamb, rice, jameed (dried yogurt), cream, butter, cardamom"]],["#8a5a1f","#c0284f"]),
dish("🍝","Rice and mains 3",[["Chicken Butter Masala","chicken breast, yogurt, cashew, butter, fresh cream, spices"],["Penne Pasta with White Sauce","pasta, mushroom, chicken, fresh cream, parmesan"],["Yasmine Palace Meat Burger","lamb meat, burger bread, cheddar, tomato, lettuce, mushroom, fries"]],["#c0284f","#e0a93b"]),

{i:"🔁",t:"Review 5 (Days 21–24)",k:"Review",c:["#244463","#c0284f"],p:["Majbous: spiced rice with lamb, nuts and lentil stuffing.","Biryani comes with raita.","Cheese Fatayer: moshalal and kashkaval cheese.","Spinach Fatayer has walnut. Always confirm allergens."],s:"“Let me confirm the nuts with our kitchen.”",q:"Name 2 cheeses in Cheese Fatayer.",a:"Moshalal and kashkaval."},
dish("🫓","Flatbreads and Safiha",[["Zaatar Flatbread","fatayer dough, zaatar, olive oil, sumac, rocca, cherry tomato, walnut, pomegranate seeds"],["Muhamara Flatbread","fatayer dough, tomato, onion, olive oil, cumin, sesame, walnut, rocca"],["Meat Safiha","fatayer dough, lamb, red onion, seven spices, pomegranate sauce or tomato, pine nut; yogurt side"]],["#5b2a6b","#e0a93b"]),
dish("🍮","Desserts 1: Milk desserts",[["Andalusia with Cream","milk, cream, starch, sugar, kashta, caramel, pistachio, flower jam"],["Muhalabiya","milk, starch, sugar, rose water, cream, almond, pistachio, flower jam"],["Rice Pudding","milk, rice, starch, sugar, rose water, cream, pistachio, flower jam"]],["#e08aa8","#e0a93b"]),
dish("🍰","Desserts 2",[["Kunafa with Cheese","kunafa dough, akkawi cheese, shulal cheese, ghee, sugar syrup, pistachio"],["Baklava with Ice Cream","baklava dough, Arabic ice cream, cotton candy, caramel, cream, pistachio, rose jam"],["Strawberry Cheesecake","Philadelphia cheese, eggs, sugar, corn flour, labneh, strawberry, digestive biscuits, butter"]],["#c0284f","#e0a93b"]),
{i:"🥤",t:"Drinks and tea/coffee",k:"Menu",c:["#c0284f","#7ccfa8"],p:["<b>Yasmina (welcome drink)</b>: hibiscus with lemon, rose water and sugar.","<b>Hibiscus Strawberry Iced Tea</b>: fresh strawberry juice, iced hibiscus tea, mint leaves, real strawberry pulp.","Water: ask still or sparkling, chilled or room temperature. Pour with the label facing the guest.","Hot drinks offered at the end: tea, Arabic coffee, espresso-based drinks and mocktails."],s:"“How would you like your water, still or sparkling, chilled or at room temperature?”",q:"What is in the Hibiscus Strawberry Iced Tea?",a:"Fresh strawberry juice, iced hibiscus tea, mint leaves and real strawberry pulp.",w:"Source: the Sequence of Service file. The menu PDF has no drinks pages, so ask the bar team for the full drinks list and allergens."},
{i:"🏆",t:"Final review and role-play",k:"Review",c:["#e0a93b","#c0284f"],p:["Role-play: welcome, allergy check, drink, serve a starter, serve a main, farewell. Say every script aloud.","Check: timings, correct guest, announce each dish.","Safety: never guess allergens. Tell manager and kitchen.","Ask your manager to watch you and give feedback."],s:"“It was an absolute pleasure having you with us. Please join us again.”",q:"A guest asks if the Fattoush is nut-free. What do you say?",a:"“I don’t want to give you incorrect information. I’ll check with our kitchen and manager.”"}
];
const B=[
["🎯","Testing effect","Trying to remember is stronger than re-reading.","Cover the answer. Say it first, then check."],
["⏳","Spacing effect","Short reviews on later days build long memory.","Review a lesson on day +1, +3 and +7. The app shows you when."],
["🗣️","Say it aloud","Speaking uses more brain paths. It also builds confidence for guests.","Say each guest sentence 3 times, standing up."],
["🖼️","Picture power","Pictures stick better than words.","Imagine the dish on the table, with colors and steam."],
["🧩","Chunking","The brain holds about 3 to 5 items at once.","Learn 3 dishes a day, not 10. Group 11 steps in 4 parts."],
["👶","Teach it simply","If you can explain it simply, you know it.","Explain today’s lesson to a friend in 1 minute."],
["🌱","Growth mindset","A mistake is information, not a failure.","Say: “I do not know it yet.” Then use the Again button."],
["🏁","Small wins","Finishing small tasks gives your brain a reward.","One lesson a day. Keep the streak. Do not skip."],
["😴","Sleep and walk","Memory is saved during sleep.","Review 5 minutes before bed. Sleep. Test in the morning."],
["🪞","Power pose and calm voice","Calm body gives a calm voice with guests.","Shoulders back, slow breath, smile, then speak."]
];
const S={t:"today",sel:null,done:{}};
try{Object.assign(S.done,JSON.parse(localStorage.getItem("ypd")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ypd",JSON.stringify(S.done))}catch(e){}};
const cur=()=>{let n=1;while(S.done[n]&&n<30)n++;return n};
const day=d=>new Date(d).toDateString();
const streak=()=>{const s=new Set(Object.values(S.done).map(day));let n=0,d=new Date();if(!s.has(d.toDateString()))d.setDate(d.getDate()-1);while(s.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n};
const $=s=>document.querySelector(s);
function head(){const n=Object.keys(S.done).length,p=Math.round(n/30*100);$("#ring").style.setProperty("--p",p);$("#pc").textContent=p+"%";$("#sub").textContent=n>=30?"All 30 days done. Well done!":`Next: Day ${cur()} · ${D[cur()-1].t}`;$("#chips").innerHTML=`<span class="chip">✅ ${n}/30 days</span><span class="chip">🔥 ${streak()} day streak</span>`}
function lesson(n){const d=D[n-1],b=B[(n-1)%B.length],locked=n>cur()&&!S.done[n];
const due=[n-1,n-3,n-7].filter(x=>x>0&&S.done[x]);
return`<div class="card"><div class="pic" style="--c1:${d.c?d.c[0]:"#c0284f"};--c2:${d.c?d.c[1]:"#e0a93b"}">${d.i}</div>
<div class="k">Day ${n} of 30 · ${d.k}</div><h2>${d.t}</h2>
${due.length?`<div class="warn">🔁 Quick review first (2 min): ${due.map(x=>`Day ${x} – ${D[x-1].t}`).join("; ")}. Try to remember before you look.</div>`:""}
<h3>Key points</h3><ul>${d.p.map(x=>`<li>${x}</li>`).join("")}</ul>
${d.e?`<h3>Example</h3><p>${d.e}</p>`:""}
<h3>Say it like this</h3><div class="say">${d.s}</div>
${d.w?`<p class="warn">⚠️ ${d.w}</p>`:""}</div>
<div class="card"><h3>Mini quiz</h3><p><b>${d.q}</b></p><p>Say your answer aloud first.</p>
<button class="b g" onclick="this.nextElementSibling.classList.add('s')">Show answer</button>
<div class="ans">${d.a}<br><button class="b" onclick="fin(${n},1)">✅ I got it</button><button class="b g" onclick="fin(${n},0)">🔁 Again</button></div>
${S.done[n]?`<p class="k">✅ Completed</p>`:""}${locked?`<p class="warn">This day is locked. Finish earlier days first.</p>`:""}</div>
<div class="card brain"><span class="k">${b[0]} Brain boost: ${b[1]}</span><p>${b[2]}</p><p><b>Do this today:</b> ${b[3]}</p></div>`}
function fin(n,ok){if(!ok){alert("Good. Read the lesson again and say the answer aloud. Try again after a short break.");return}
if(n>cur()){return}S.done[n]=Date.now();save();head();const nx=Math.min(n+1,30);S.sel=nx;go("today",1);scrollTo(0,0)}
function days(){return`<div class="grid">${D.map((d,i)=>{const n=i+1,c=S.done[n]?"ok":n>cur()?"lock":n==cur()?"cur":"";return`<button class="d ${c}" onclick="${n>cur()&&!S.done[n]?"alert('Finish the earlier days first.')":`S.sel=${n};go('today',1)`}"><i>${S.done[n]?"✅":n>cur()?"🔒":d.i}</i><b>Day ${n}</b><small>${d.t}</small></button>`}).join("")}</div>`}
function brain(){return`<div class="card brain"><h2>How to learn fast</h2><p>Study 25 minutes. Rest 5 minutes. Use this order each day:</p><ul><li>5 min: review old lesson from memory</li><li>10 min: learn the new points</li><li>5 min: say the guest sentence aloud</li><li>5 min: quiz, then log the day</li></ul></div>
<div class="card"><h2>10 brain tools</h2>${B.map(b=>`<div class="tip"><span>${b[0]}</span><div><b>${b[1]}</b>${b[2]}<br><i>${b[3]}</i></div></div>`).join("")}</div>
<div class="card"><h3>Offline use</h3><p>This app works without internet. Save it on your phone and open it any time. Your progress is saved on your device only.</p></div>`}
function go(t,k){S.t=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));
$("#v").innerHTML=t=="today"?lesson(S.sel&&k?S.sel:(S.sel=cur())):t=="days"?days():brain();head()}

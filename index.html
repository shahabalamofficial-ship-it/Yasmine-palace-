const pick=a=>a[Math.random()*a.length|0],shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const CO=["Syria","Lebanon","Palestine","Jordan","Qatar","South Asia (India/Pakistan)","Italy","Iran","Turkey","Egypt"];

const GEN=/salt|pepper|\boil\b|water|sugar/i,GP=[...new Set(OKD.flatMap(x=>{const m=x[2].match(/garnish:\s*([^;.]*)/i);return m?items(m[1]).map(i=>i.toLowerCase()):[]}))];
function mkQ(c){const L=OKD.filter(x=>!c||x[0]==c),LP=[...new Set(L.flatMap(x=>items(x[2]).map(i=>i.toLowerCase())))],CL=L.filter(x=>cuiOf(x[1])),r=Math.random();
if(r<.2&&CL.length){const d=pick(CL),u=cuiOf(d[1]);return{d,u,q:`Which country is <b>${d[1]}</b> from?`,o:shuf([u[0],...shuf(CO.filter(x=>x!=u[0])).slice(0,3)]),a:u[0]}}
const d=pick(L),its=items(d[2]),low=d[2].toLowerCase(),ng=its.filter(i=>!GEN.test(i)),base=ng.length?ng:its;
const wr=(n,f)=>{let w=shuf(LP).filter(x=>!low.includes(x)&&f(x));if(w.length<n)w=w.concat(shuf(POOL).filter(x=>!low.includes(x)&&f(x)&&!w.includes(x)));return w.slice(0,n)};
if(r<.6&&base.length>=3&&r>=.4){const real=shuf(base).slice(0,3).map(x=>x.toLowerCase()),w=wr(1,x=>!real.some(y=>y.includes(x)||x.includes(y)))[0];return{d,q:`Which ingredient is <b>NOT</b> in <b>${d[1]}</b>?`,o:shuf([w,...real]),a:w}}
if(r>=.6&&r<.8){const m=d[2].match(/garnish:\s*([^;.]*)/i),gi=m?items(m[1]):[];if(gi.length){const ok=pick(gi).toLowerCase(),w=shuf(GP).filter(x=>!low.includes(x)&&!x.includes(ok)&&!ok.includes(x));if(w.length>=3)return{d,q:`Which one is a garnish of <b>${d[1]}</b>?`,o:shuf([ok,...w.slice(0,3)]),a:ok}}}
if(r<.4||r>=.8&&r<.88){const ok=pick(base).toLowerCase(),w=wr(3,x=>!x.includes(ok)&&!ok.includes(x));return{d,q:`Which one is an ingredient of <b>${d[1]}</b>?`,o:shuf([ok,...w]),a:ok}}
const cl=base.sort((x,y)=>F[x.toLowerCase()]-F[y.toLowerCase()]).slice(0,3),cs=cl.map(x=>x.toLowerCase()),ds=new Set(its.map(x=>x.toLowerCase()));
let o=shuf(OKD.filter(x=>x!=d&&!cs.some(k=>x[2].toLowerCase().includes(k)))).sort((x,y)=>(items(y[2]).filter(i=>ds.has(i.toLowerCase())).length+(y[0]==d[0]?3:0))-(items(x[2]).filter(i=>ds.has(i.toLowerCase())).length+(x[0]==d[0]?3:0))).slice(0,3);
return{d,q:`Which dish has: <b>${cl.join(", ")}</b>?`,o:shuf([d[1],...o.map(x=>x[1])]),a:d[1]}}
const T={cat:"",n:0,s:0,cur:null,pick:null,fin:0};

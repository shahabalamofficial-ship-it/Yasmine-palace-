const EMO=[[/olive oil|\boil\b/,"🫒"],[/pomegranate/,"🔴"],[/ice cream/,"🍨"],[/chickpea|hummus|fava|foul|lentil/,"🫘"],[/walnut/,"🌰"],[/pistachio|almond|cashew|pine nut|nuts|sesame|tahina/,"🥜"],[/eggplant/,"🍆"],[/cherry tomato|tomato|ketchup/,"🍅"],[/lemon|lime/,"🍋"],[/parsley|mint|coriander|basil|rocca|dill|oregano|zaatar|herb|microgreen|leaves/,"🌿"],[/garlic/,"🧄"],[/onion|leek/,"🧅"],[/potato|fries/,"🥔"],[/cheese|halloumi|labneh|kashta|maska|parmesan/,"🧀"],[/chicken|wings|liver/,"🍗"],[/lamb|meat|sausage|shuqaf|kebab|shawarma|burger/,"🥩"],[/shrimp|oyster|seafood/,"🦐"],[/fish|seabass/,"🐟"],[/rice|bulgur|wheat|semolina/,"🍚"],[/egg/,"🥚"],[/milk|cream|yogurt|jameed/,"🥛"],[/butter|ghee/,"🧈"],[/cucumber|zucchini/,"🥒"],[/carrot/,"🥕"],[/capsicum|pepper|paprika|chili/,"🌶️"],[/mushroom/,"🍄"],[/spinach|lettuce|cabbage|purslane|broccoli|asparagus|green beans|peas/,"🥬"],[/bread|flour|dough|toast|biscuit|saj|yeast|pastry|kunafa|baklava|crumbs/,"🍞"],[/pasta|penne/,"🍝"],[/beetroot/,"🟣"],[/strawberry/,"🍓"],[/apple/,"🍏"],[/fig|raisin|grape/,"🍇"],[/corn/,"🌽"],[/ginger/,"🫚"],[/sugar|syrup|jam|caramel|honey/,"🍬"],[/salt/,"🧂"],[/chocolate|cocoa/,"🍫"],[/saffron|turmeric|cumin|cardamom|cinnamon|clove|anise|spice|masala|sumac/,"🟠"],[/\bwater\b|\bice\b/,"💧"]];
const eOf=x=>(EMO.find(r=>r[0].test(x.toLowerCase()))||[0,""])[1];
const slug=n=>n.toLowerCase().replace(/\s*\(.*\)/,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const chips=t=>{const sn=new Set();return t.split(/[,;]|\.\s/).map(x=>x.replace(/^\s*(garnish|sides?|with|sauce|dough|filling)\s*:\s*/i,"").trim()).filter(x=>x&&x.length<48&&!sn.has(x)&&sn.add(x)).map(x=>`<span class="ic"><i>${eOf(x)||"•"}</i>${x}</span>`).join("")};
const plate=(n,t)=>{const em=[...new Set(t.split(/[,;]/).map(eOf).filter(Boolean))].slice(0,6).join(" ");return`<div class="plate"><span>${em||"🍽️"}</span><img src="img/${slug(n)}.jpg" alt="${n}" onerror="this.remove()"></div>`};
const dishHTML=g=>`<details><summary>${g[1]}</summary>${plate(g[1],g[2])}<div>${chips(g[2])}</div><p>${g[2]}</p></details>`;
const ingOf=n=>{const k=n.toLowerCase().replace(/\s*\(.*\)/,"");return ING.find(x=>x[1].toLowerCase().replace(/\s*\(.*\)/,"")==k)};
const S={t:"today",sel:null,done:{}};
try{Object.assign(S.done,JSON.parse(localStorage.getItem("ypd")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ypd",JSON.stringify(S.done))}catch(e){}};
const cur=()=>{let n=1;while(S.done[n]&&n<30)n++;return n};
const day=d=>new Date(d).toDateString();
const streak=()=>{const s=new Set(Object.values(S.done).map(day));let n=0,d=new Date();if(!s.has(d.toDateString()))d.setDate(d.getDate()-1);while(s.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}return n};
const $=s=>document.querySelector(s);
function head(){const n=Object.keys(S.done).length,p=Math.round(n/30*100);$("#ring").style.setProperty("--p",p);$("#pc").textContent=p+"%";$("#sub").textContent=n>=30?"All 30 days done. Well done!":`Next: Day ${cur()} · ${D[cur()-1].t}`;$("#chips").innerHTML=`<span class="chip">✅ ${n}/30 days</span><span class="chip">🔥 ${streak()} day streak</span>`}
function lesson(n){const d=D[n-1],b=B[(n-1)%B.length],locked=n>cur()&&!S.done[n];

return`<div class="card"><div class="pic" style="--c1:${d.c?d.c[0]:"#c0284f"};--c2:${d.c?d.c[1]:"#e0a93b"}">${d.i}</div>

${d.e?`<h3>Example</h3><p>${d.e}</p>`:""}
<h3>Say it like this</h3><div class="say">${d.s}</div>
${d.k=="Menu"?full(d):""}${d.w?`<p class="warn">⚠️ ${d.w}</p>`:""}</div>

<button class="b g" onclick="this.nextElementSibling.classList.add('s')">Show answer</button>
<div class="ans">${d.a}<br><button class="b" onclick="fin(${n},1)">✅ I got it</button><button class="b g" onclick="fin(${n},0)">🔁 Again</button></div>
${S.done[n]?`<p class="k">✅ Completed</p>`:""}${locked?`<p class="warn">This day is locked. Finish earlier days first.</p>`:""}</div>
<div class="card brain"><span class="k">${b[0]} Brain boost: ${b[1]}</span><p>${b[2]}</p><p><b>Do this today:</b> ${b[3]}</p></div>`}
function fin(n,ok){if(!ok){alert("Good. Read the lesson again and say the answer aloud. Try again after a short break.");return}
if(n>cur()){return}S.done[n]=Date.now();save();head();const nx=Math.min(n+1,30);S.sel=nx;go("today",1);scrollTo(0,0)}
function days(){return`<div class="grid">${D.map((d,i)=>{const n=i+1,c=S.done[n]?"ok":n>cur()?"lock":n==cur()?"cur":"";return`<button class="d ${c}" onclick="${n>cur()&&!S.done[n]?"alert('Finish the earlier days first.')":`S.sel=${n};go('today',1)`}"><i>${S.done[n]?"✅":n>cur()?"🔒":d.i}</i><b>Day ${n}</b><small>${d.t}</small></button>`}).join("")}</div>`}
function full(d){const r=d.p.map(x=>{const m=x.match(/<b>(.*?)<\/b>/);const g=m&&ingOf(m[1]);return g?dishHTML(g):""}).join("");return r?`<h3>Full ingredients (menu PDF)</h3>${r}`:""}
function menu(q=""){q=q.toLowerCase();let c="",o="";ING.filter(x=>!q||(x[1]+" "+x[2]).toLowerCase().includes(q)).forEach(x=>{if(x[0]!=c){c=x[0];o+=`<div class="cat">${c}</div>`}o+=dishHTML(x)});return o||"<p>No dish found.</p>"}
function find(v){$("#ml").innerHTML=menu(v)}
function brain(){return`<div class="card brain"><h2>How to learn fast</h2><p>Study 25 minutes. Rest 5 minutes. Use this order each day:</p><ul><li>5 min: review old lesson from memory</li><li>10 min: learn the new points</li><li>5 min: say the guest sentence aloud</li><li>5 min: quiz, then log the day</li></ul></div>
<div class="card"><h2>10 brain tools</h2>${B.map(b=>`<div class="tip"><span>${b[0]}</span><div><b>${b[1]}</b>${b[2]}<br><i>${b[3]}</i></div></div>`).join("")}</div>
<div class="card"><h3>Offline use</h3><p>This app works without internet. Save it on your phone and open it any time. Your progress is saved on your device only.</p></div>`}
function go(t,k){S.t=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));
$("#v").innerHTML=t=="today"?lesson(S.sel&&k?S.sel:(S.sel=cur())):t=="days"?days():t=="menu"?`<div class="card"><h2>Menu ingredients</h2><p class="warn">Taken from the menu PDF text. Allergen icons are not readable here, so always confirm allergens with the kitchen and manager.</p><input class="q" placeholder="Search dish or ingredient (e.g. walnut)" oninput="find(this.value)" aria-label="Search"><div id="ml">${menu()}</div></div>`:brain();head()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(b.dataset.t=="today")S.sel=cur();go(b.dataset.t)});
go("today");
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
